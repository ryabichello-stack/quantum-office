<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Quantum Panel">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="45%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a4c"/>
      <stop offset="100%" stop-color="#e85a1a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <g transform="translate(256 178)">
    <circle r="92" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <circle r="68" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <path d="M -48 -48 A 68 68 0 0 1 48 -48" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="48" cy="-48" r="7.5" fill="url(#accent)" filter="url(#soft)"/>
    <rect x="-42" y="28" width="84" height="8" rx="4" fill="#ffffff" fill-opacity="0.20"/>
    <rect x="-42" y="28" width="34" height="8" rx="4" fill="url(#accent)"/>
    <rect x="-42" y="44" width="56" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.10"/>
  </g>
  <text x="256" y="352" text-anchor="middle" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="300" letter-spacing="0.12em">QUANTUM</text>
  <text x="256" y="398" text-anchor="middle" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="0.28em">PANEL</text>
  <rect x="196" y="418" width="120" height="2" rx="1" fill="url(#accent)" fill-opacity="0.85"/>
</svg>
