<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Quantum Panel">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="45%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a4c"/>
      <stop offset="100%" stop-color="#e85a1a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- iOS-style squircle canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- Quantum orbit + control plane mark -->
  <g transform="translate(256 228)">
    <circle r="118" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <circle r="88" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
    <path d="M -62 -62 A 88 88 0 0 1 62 -62" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="62" cy="-62" r="9" fill="url(#accent)" filter="url(#soft)"/>
    <!-- Minimal panel bar -->
    <rect x="-54" y="36" width="108" height="10" rx="5" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="-54" y="36" width="44" height="10" rx="5" fill="url(#accent)"/>
    <rect x="-54" y="58" width="72" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>
  </g>
</svg>
