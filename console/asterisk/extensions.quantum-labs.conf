; Quantum Labs — inbound Mango → AI + outbound via Mango trunk
; Канон: копируется в /etc/asterisk/extensions.conf (ensure_asterisk_config.sh)
; Reload: asterisk -rx "dialplan reload"
;
; Автолиния входящих: AstDB key quantum/inbound_line
;   on  (или отсутствует) → принять и отдать ИИ-секретарю
;   off → Busy, без Stasis / OpenAI
;
; Mango API callback: extension 12 (Бот Гарик) → AI_CONTEXT=outbound + pending script

; ---------------------------------------------------------------------------
; INBOUND
; ---------------------------------------------------------------------------
[from-mango]
exten => s,1,NoOp(=== INCOMING CALL RECEIVED ON 'S' ===)
 same => n,GotoIf($["${DB(quantum/inbound_line)}" = "off"]?line_off)
 same => n,Answer()
 same => n,Set(TIMEOUT(absolute)=600)
 same => n,Set(AI_CONTEXT=default)
 same => n,Set(AI_PROVIDER=openai_live_pilot)
 same => n,NoOp(ANI raw CALLERID(num)=${CALLERID(num)} PAI=${PJSIP_HEADER(read,P-Asserted-Identity)} RPID=${PJSIP_HEADER(read,Remote-Party-ID)} FROM=${CHANNEL(pjsip,from)})
 same => n,Set(REAL_ANI=${CALLERID(num)})
 same => n,ExecIf($["${REAL_ANI}" = "79699665899" | "${REAL_ANI}" = ""]?Set(REAL_ANI=${PJSIP_HEADER(read,P-Asserted-Identity)}))
 same => n,ExecIf($["${REAL_ANI}" = "79699665899" | "${REAL_ANI}" = ""]?Set(REAL_ANI=${PJSIP_HEADER(read,Remote-Party-ID)}))
 same => n,Set(REAL_ANI=${FILTER(0-9,${REAL_ANI})})
 same => n,ExecIf($["${REAL_ANI}" != "" & "${REAL_ANI}" != "79699665899"]?Set(CALLERID(num)=${REAL_ANI}))
 same => n,NoOp(ANI final CALLERID(num)=${CALLERID(num)} REAL_ANI=${REAL_ANI})
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()
 same => n(line_off),NoOp(Quantum inbound line DISABLED via AstDB quantum/inbound_line)
 same => n,Busy(8)
 same => n,Hangup()

exten => garik,1,Goto(from-mango,s,1)
exten => live,1,Goto(from-ai-agent,live,1)
exten => 9911,1,Goto(from-ai-agent,live,1)
exten => cartesia,1,Goto(from-ai-agent,cartesia,1)
exten => 9901,1,Goto(from-ai-agent,cartesia,1)

; Mango VPBX API callback first leg (Бот Гарик = 12) → outbound playbook, not inbound secretary
exten => 12,1,NoOp(=== MANGO CALLBACK → OUTBOUND AVA ===)
 same => n,Answer()
 same => n,Set(TIMEOUT(absolute)=600)
 same => n,Set(AI_CONTEXT=outbound)
 same => n,Set(AI_PROVIDER=${IF($["${DB(quantum/outbound_provider)}"=""]?openai_live_pilot:${DB(quantum/outbound_provider)})})
 same => n,Set(AAVA_OUTBOUND=1)
 same => n,Set(AAVA_OUTBOUND_PHONE=${DB(quantum/outbound_phone)})
 same => n,ExecIf($["${DB(quantum/outbound_script_file)}" != ""]?Set(AAVA_CALL_SCRIPT_FILE=${DB(quantum/outbound_script_file)}))
 same => n,ExecIf($["${DB(quantum/outbound_greeting)}" != ""]?Set(AAVA_CALL_GREETING=${DB(quantum/outbound_greeting)}))
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

exten => _.,1,Goto(from-mango,s,1)

[from-ai-agent]
exten => s,1,NoOp(AI Agent Call)
 same => n,GotoIf($["${DB(quantum/inbound_line)}" = "off"]?line_off)
 same => n,Set(TIMEOUT(absolute)=600)
 same => n,Set(AI_CONTEXT=default)
 same => n,Set(AI_PROVIDER=openai_live_pilot)
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()
 same => n(line_off),NoOp(Quantum inbound line DISABLED via AstDB)
 same => n,Busy(8)
 same => n,Hangup()

; Cartesia TTS voice pilot (does NOT change Mango default)
exten => cartesia,1,NoOp(Cartesia TTS pilot)
 same => n,Answer()
 same => n,Set(TIMEOUT(absolute)=600)
 same => n,Set(AI_CONTEXT=cartesia_pilot)
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

; GPT-Live-1 / Cedar pilot (does NOT change Mango default)
exten => live,1,NoOp(GPT-Live-1 Cedar pilot)
 same => n,Answer()
 same => n,Set(TIMEOUT(absolute)=600)
 same => n,Set(AI_CONTEXT=live_pilot)
 same => n,Set(AI_PROVIDER=openai_live_pilot)
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; OUTBOUND — AVA Campaign Dialer originates Local/<digits>@from-internal
; Post-unban 2026-07-23: employee SIP (mango-employee) works again; trunk optional.
; Phone format: digits only, typically 7XXXXXXXXXX (no '+')
; Console one-shot: ARI originate PJSIP/<phone>@mango-employee → Stasis (бот).
; Голый Dial без Stasis = гудки есть, голоса бота нет.
; SIP signaling must egress from 45.147.178.172 (see pjsip bind + mango-snat).
; ---------------------------------------------------------------------------
[from-internal]
; Identity/extension used as Local target when dialer probes internal endpoints
exten => 6789,1,NoOp(AAVA outbound identity stub)
 same => n,Hangup()

; Official Mango Asterisk guide uses _8XXXXXXXXXX; we accept 8... and 7...
exten => _8XXXXXXXXXX,1,NoOp(Quantum outbound via employee SIP EXTEN=${EXTEN} official-8)
 same => n,Set(CALLERID(all)=Quantum Labs <79699665899>)
 same => n,Dial(PJSIP/${EXTEN}@mango-employee,60,tT)
 same => n,Hangup()

exten => _7XXXXXXXXXX,1,NoOp(Quantum outbound via employee SIP EXTEN=${EXTEN})
 same => n,Set(CALLERID(all)=Quantum Labs <79699665899>)
 same => n,Dial(PJSIP/${EXTEN}@mango-employee,60,tT)
 same => n,Hangup()

; fallback other lengths → employee SIP
exten => _X!,1,NoOp(Quantum outbound via employee SIP EXTEN=${EXTEN} fallback)
 same => n,Set(CALLERID(all)=Quantum Labs <79699665899>)
 same => n,Dial(PJSIP/${EXTEN}@mango-employee,60,tT)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; AMD hop — required by AVA outbound dialer (continueInDialplan)
; Snippet aligned with Admin UI Call Scheduling generator
; ---------------------------------------------------------------------------
[aava-outbound-amd]
exten => s,1,NoOp(AAVA Outbound AMD hop)
 same => n,NoOp(Attempt=${AAVA_ATTEMPT_ID} Campaign=${AAVA_CAMPAIGN_ID} Lead=${AAVA_LEAD_ID})
 same => n,ExecIf($["${AAVA_AMD_OPTS}" = ""]?Set(AAVA_AMD_OPTS=2000,2000,1000,5000))
 same => n,AMD(${AAVA_AMD_OPTS})
 same => n,NoOp(AMDSTATUS=${AMDSTATUS} AMDCAUSE=${AMDCAUSE})
 same => n,GotoIf($["${AMDCAUSE:0:7}" = "TOOLONG"]?human)
 same => n,GotoIf($["${AMDCAUSE:0:14}" = "INITIALSILENCE"]?human)
 same => n,GotoIf($["${AMDSTATUS}" = "HUMAN"]?human)
 same => n,GotoIf($["${AMDSTATUS}" = "NOTSURE"]?machine)
 same => n(machine),GotoIf($["${AAVA_VM_ENABLED}" = "1"]?vm:machine_done)
 same => n(vm),WaitForSilence(1500,3,10)
 same => n(machine_done),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},MACHINE,${AMDCAUSE},,)
 same => n,Hangup()
 same => n(human),GotoIf($["${AAVA_CONSENT_ENABLED}" = "1"]?consent:human_done)
 same => n(consent),Set(TIMEOUT(response)=${IF($["${AAVA_CONSENT_TIMEOUT}"=""]?5:${AAVA_CONSENT_TIMEOUT})})
 same => n,Read(AAVA_CONSENT_DTMF,${AAVA_CONSENT_PLAYBACK},1)
 same => n,GotoIf($["${AAVA_CONSENT_DTMF}" = "1"]?human_ok)
 same => n,GotoIf($["${AAVA_CONSENT_DTMF}" = "2"]?human_denied)
 same => n(human_timeout),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},HUMAN,${AMDCAUSE},,timeout)
 same => n,Hangup()
 same => n(human_denied),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},HUMAN,${AMDCAUSE},2,denied)
 same => n,Hangup()
 same => n(human_ok),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},HUMAN,${AMDCAUSE},1,accepted)
 same => n,Hangup()
 same => n(human_done),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},HUMAN,${AMDCAUSE},,skipped)
 same => n,Hangup()
