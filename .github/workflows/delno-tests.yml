name: delno-tests

on:
  push:
    paths:
      - "delno-api/**"
      - "delno-knowledge/**"
      - "docs/DELNO*.md"
      - ".github/workflows/delno-tests.yml"
  pull_request:
    paths:
      - "delno-api/**"
      - "delno-knowledge/**"
      - "docs/DELNO*.md"
      - ".github/workflows/delno-tests.yml"

jobs:
  delno-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: delno_uat_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: delno_uat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delno_uat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r delno-api/requirements.txt
      - name: Check clean and existing PostgreSQL migrations
        working-directory: delno-api
        env:
          DATABASE_URL: postgresql+psycopg://delno_uat_ci:ci-only-password@localhost:5432/delno_uat_ci
          DELNO_MIGRATION_TEST: "1"
        run: PYTHONPATH=. pytest tests/test_migration_bootstrap.py -q

  delno-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install delno-api deps
        run: pip install -r delno-api/requirements.txt
      - name: pytest delno-api
        working-directory: delno-api
        run: PYTHONPATH=. pytest tests -q

  delno-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install delno-knowledge deps
        run: |
          pip install -r delno-knowledge/requirements.txt
          pip install -r delno-knowledge/brain_platform/requirements-dev.txt httpx
      - name: pytest brain security + isolation
        working-directory: delno-knowledge
        run: |
          PYTHONPATH=. pytest brain_platform/tests/test_security_contracts.py \
            brain_platform/tests/test_tenant_isolation_and_acl.py \
            brain_platform/tests/test_api_acl_smoke.py \
            brain_platform/tests/test_demo_seed.py \
            brain_platform/tests/test_brain_integration.py -q
