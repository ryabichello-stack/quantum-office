# Isolated Hermes multiplex pool (dogfood). Does NOT touch Asterisk/telephony.
# Each worker is a Hermes gateway root: HERMES_HOME=.../workers/<id>
# Company profiles: .../workers/<id>/profiles/<profile_id> → /p/<profile_id>/v1/...
# Usage (from delno-api/):
#   export API_SERVER_KEY=dev-hermes-key-aaaaaaaa
#   docker compose -f hermes_runtime/docker-compose.hermes.yml up --build
services:
  hermes-tenant-a:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HERMES_AGENT_GIT_REF: v0.23.1
    image: delno-hermes-runtime:v0.23.1
    container_name: delno-hermes-tenant-a
    environment:
      HERMES_PROFILES_ROOT: /data/hermes-profiles
      HERMES_WORKER_ID: tenant-a
      HERMES_HOME: /data/hermes-profiles/workers/tenant-a
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY:-dev-hermes-key-aaaaaaaa}
      # Multiplex: leave empty — per-run tokens only (never a shared company MCP key).
      DELNO_MCP_KEY: ""
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      HTTPS_PROXY: ${OPENAI_HTTP_PROXY:-}
    volumes:
      - hermes-tenant-a-data:/data/hermes
      - hermes-profiles:/data/hermes-profiles
      - ./templates/home:/opt/delno-hermes-templates:ro
      - ./templates/worker_root:/opt/delno-hermes-templates-root:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "127.0.0.1:18642:8642"
    init: true
    mem_limit: 2g
    pids_limit: 512
    networks:
      - hermes-lab
      - delno-internal

  hermes-tenant-b:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HERMES_AGENT_GIT_REF: v0.23.1
    image: delno-hermes-runtime:v0.23.1
    container_name: delno-hermes-tenant-b
    environment:
      HERMES_PROFILES_ROOT: /data/hermes-profiles
      HERMES_WORKER_ID: tenant-b
      HERMES_HOME: /data/hermes-profiles/workers/tenant-b
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${API_SERVER_KEY_B:-dev-hermes-key-bbbbbbbb}
      DELNO_MCP_KEY: ""
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      HTTPS_PROXY: ${OPENAI_HTTP_PROXY:-}
    volumes:
      - hermes-tenant-b-data:/data/hermes
      - hermes-profiles:/data/hermes-profiles
      - ./templates/home:/opt/delno-hermes-templates:ro
      - ./templates/worker_root:/opt/delno-hermes-templates-root:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "127.0.0.1:18643:8642"
    init: true
    mem_limit: 2g
    pids_limit: 512
    networks:
      - hermes-lab
      - delno-internal

networks:
  hermes-lab:
    name: delno-hermes-lab
  delno-internal:
    external: true
    name: delno-internal

volumes:
  hermes-tenant-a-data:
  hermes-tenant-b-data:
  hermes-profiles:
    name: hermes-profiles
    external: true
