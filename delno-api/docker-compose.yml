services:
  postgres:
    image: postgres:16-alpine
    container_name: delno-postgres-dev
    networks:
      - delno-internal
    environment:
      POSTGRES_USER: delno
      POSTGRES_PASSWORD: delno
      POSTGRES_DB: delno
    volumes:
      - delno-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delno"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: delno-api:latest
    container_name: delno-api-dev
    networks:
      - delno-internal
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://delno:delno@postgres:5432/delno
      KNOWLEDGE_BASE_URL: http://knowledge:8021
    ports:
      - "127.0.0.1:18020:8020"
    volumes:
      - delno-onboarding-uploads:/data/onboarding
    depends_on:
      postgres:
        condition: service_healthy
      knowledge:
        condition: service_started

  knowledge:
    build:
      context: ../delno-knowledge
      dockerfile: Dockerfile
    image: delno-knowledge:latest
    container_name: delno-knowledge-dev
    networks:
      - delno-internal
    environment:
      BRAIN_ENABLED: "true"
      BRAIN_DATA_DIR: /data
      BRAIN_DB_PATH: /data/brain.db
      BRAIN_TENANT_ID: delno-demo
    volumes:
      - delno-brain-data:/data
    ports:
      - "127.0.0.1:18021:8021"

networks:
  delno-internal:
    name: delno-internal-dev
    driver: bridge

volumes:
  delno-pg-data:
    name: delno-pg-data-dev
  delno-brain-data:
    name: delno-brain-data-dev
  delno-onboarding-uploads:
    name: delno-onboarding-uploads-dev