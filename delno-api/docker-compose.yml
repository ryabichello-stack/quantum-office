services:
  postgres:
    image: postgres:16-alpine
    container_name: delno-postgres-dev
    networks:
      - delno-internal
    environment:
      POSTGRES_USER: delno
      POSTGRES_PASSWORD: delno
      POSTGRES_DB: delno
    volumes:
      - delno-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delno"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: delno-api:latest
    container_name: delno-api-dev
    networks:
      - delno-internal
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://delno:delno@postgres:5432/delno
    ports:
      - "127.0.0.1:18020:8020"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  delno-internal:
    name: delno-internal-dev
    driver: bridge

volumes:
  delno-pg-data:
    name: delno-pg-data-dev