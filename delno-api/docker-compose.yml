services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: delno
      POSTGRES_PASSWORD: delno
      POSTGRES_DB: delno
    ports:
      - "5433:5432"
    volumes:
      - delno_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delno"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8020:8020"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://delno:delno@postgres:5432/delno
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  delno_pg:
