# nginx stream SNI mux for Cloud4Box :443
# - *.dlno.ru / zntn.ru → nginx HTTPS 127.0.0.1:4444
# - default → xray Reality 127.0.0.1:8443 (moved off :443)
#
# Install:
#   cp deploy/nginx-stream-sni-mux-443.conf /etc/nginx/stream.d/sni-mux-443.conf
#   ensure nginx.conf has: stream { include /etc/nginx/stream.d/*.conf; }
#   load_module modules/ngx_stream_module.so;

map $ssl_preread_server_name $dlno_backend {
    dlno.ru              127.0.0.1:4444;
    www.dlno.ru          127.0.0.1:4444;
    api.dlno.ru          127.0.0.1:4444;
    app.dlno.ru          127.0.0.1:4444;
    admin.dlno.ru        127.0.0.1:4444;
    cdn.dlno.ru          127.0.0.1:4444;
    wiki.dlno.ru         127.0.0.1:4444;
    status.dlno.ru       127.0.0.1:4444;
    zntn.ru              127.0.0.1:4444;
    www.zntn.ru          127.0.0.1:4444;
    default              127.0.0.1:8443;
}

server {
    listen 443 reuseport;
    listen [::]:443 reuseport;
    proxy_pass $dlno_backend;
    ssl_preread on;
    proxy_connect_timeout 5s;
    proxy_timeout 600s;
}
