# DELNO production ingress — dlno.ru and subdomains
# Install: delno-api/deploy/install_dlno_ingress.sh
#
# Backends (127.0.0.1 only):
#   dlno.ru          → :18022  delno-site-root (marketing)
#   api.dlno.ru      → :18020  delno-api
#   app.dlno.ru      → :18023  delno-web (tenant cabinet)
#   admin.dlno.ru    → :18024  delno-admin (platform CMS)
#   wiki.dlno.ru     → placeholder 503 (future wiki)
#   cdn.dlno.ru      → /opt/delno/cdn static
#   status.dlno.ru   → placeholder 503 (future status page)
#   www.dlno.ru      → 301 → https://dlno.ru

# --- www → apex (HTTP) ---
server {
    listen 80;
    listen [::]:80;
    server_name www.dlno.ru;
    return 301 $scheme://dlno.ru$request_uri;
}

# --- Marketing site ---
server {
    listen 80;
    listen [::]:80;
    server_name dlno.ru;

    location / {
        proxy_pass http://127.0.0.1:18022;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# --- Platform API ---
server {
    listen 80;
    listen [::]:80;
    server_name api.dlno.ru;

    location / {
        proxy_pass http://127.0.0.1:18020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug delno-demo;
        proxy_read_timeout 120s;
    }
}

# --- Tenant cabinet (delno-web) ---
server {
    listen 80;
    listen [::]:80;
    server_name app.dlno.ru;

    location / {
        proxy_pass http://127.0.0.1:18023;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# --- Platform admin + CMS (delno-admin) ---
server {
    listen 80;
    listen [::]:80;
    server_name admin.dlno.ru;

    location / {
        proxy_pass http://127.0.0.1:18024;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# --- Wiki (placeholder — not live) ---
server {
    listen 80;
    listen [::]:80;
    server_name wiki.dlno.ru;

    root /opt/delno/ingress/wiki;
    location / {
        return 503;
    }
    error_page 503 /index.html;
    location = /index.html {
        root /opt/delno/ingress/wiki;
        internal;
        add_header Retry-After 86400 always;
    }
}

# --- CDN static (widget/assets — directory only for now) ---
server {
    listen 80;
    listen [::]:80;
    server_name cdn.dlno.ru;

    root /opt/delno/cdn;
    location / {
        autoindex off;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }
}

# --- Status page (placeholder — not live) ---
server {
    listen 80;
    listen [::]:80;
    server_name status.dlno.ru;

    root /opt/delno/ingress/status;
    location / {
        return 503;
    }
    error_page 503 /index.html;
    location = /index.html {
        root /opt/delno/ingress/status;
        internal;
        add_header Retry-After 3600 always;
    }
}
