# DELNO primary domain — dlno.ru + api.dlno.ru
# Install: deploy/install_dlno_ru.sh on prod (requires DNS → server IP)

# Site: https://dlno.ru  → delno-site-root :18022
# API:  https://api.dlno.ru → delno-api :18020

server {
    listen 80;
    listen [::]:80;
    server_name dlno.ru www.dlno.ru;

    location / {
        proxy_pass http://127.0.0.1:18022;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.dlno.ru;

    location / {
        proxy_pass http://127.0.0.1:18020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug delno-demo;
        proxy_read_timeout 120s;
    }
}
