# DELNO production ingress — HTTP (:80) ACME + redirect to HTTPS
# HTTPS terminates on 127.0.0.1:4444 (see nginx-dlno.ru.ssl.conf)
# Public :443 = stream SNI mux (see nginx-stream-sni-mux-443.conf)
#
# Cloud4Box backends:
#   dlno.ru       → :18019  delno-site
#   api.dlno.ru   → :18020  delno-api
#   app.dlno.ru   → :3020   delno-web
#   admin.dlno.ru → :3010   delno-admin
#   cdn.dlno.ru   → /opt/delno/cdn

server {
    listen 80;
    listen [::]:80;
    server_name www.dlno.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / { return 301 https://dlno.ru$request_uri; }
}

