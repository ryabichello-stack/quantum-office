server {
    listen 127.0.0.1:4444 ssl http2;
    listen [::1]:4444 ssl http2;
    server_name cdn.dlno.ru;
    ssl_certificate     /etc/letsencrypt/live/dlno.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dlno.ru/privkey.pem;
    root /opt/delno/cdn;
    location / {
        autoindex off;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin *;
    }
}

server {
    listen 127.0.0.1:4444 ssl http2;
    listen [::1]:4444 ssl http2;
    server_name wiki.dlno.ru;
    ssl_certificate     /etc/letsencrypt/live/dlno.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dlno.ru/privkey.pem;
    root /opt/delno/ingress/wiki;
    location / { return 503; }
    error_page 503 /index.html;
    location = /index.html {
        root /opt/delno/ingress/wiki;
        internal;
        add_header Retry-After 86400 always;
    }
}

server {
