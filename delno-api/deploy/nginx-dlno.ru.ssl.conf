# HTTPS for *.dlno.ru on loopback :4444 (Reality :443 dest fallback)
# Requires: /etc/letsencrypt/live/dlno.ru/{fullchain,privkey}.pem

server {
    listen 127.0.0.1:4444 ssl http2;
    listen [::1]:4444 ssl http2;
    server_name www.dlno.ru;
    ssl_certificate     /etc/letsencrypt/live/dlno.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dlno.ru/privkey.pem;
    return 301 https://dlno.ru$request_uri;
}

server {
    listen 127.0.0.1:4444 ssl http2;
    listen [::1]:4444 ssl http2;
    server_name zntn.ru www.zntn.ru;
    ssl_certificate     /etc/letsencrypt/live/dlno.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dlno.ru/privkey.pem;
    return 301 https://dlno.ru$request_uri;
}

server {
    listen 127.0.0.1:4444 ssl http2;
    listen [::1]:4444 ssl http2;
    server_name dlno.ru;
    ssl_certificate     /etc/letsencrypt/live/dlno.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dlno.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:18019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

