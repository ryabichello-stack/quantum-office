# Canonical inbound voice secretary override for Asterisk AVA (openai_realtime).
# Universal for Quantum Labs dogfood AND future tenants:
# - company facts only via tools / tenant knowledge
# - mandatory readback + confirmation for name, email, date/time
# - barge-in / short VAD for low latency
#
# Deploy target on prod: /root/ava/config/ai-agent.local.yaml
# Reload: docker restart ai_engine  (or compose restart)
#
# Secrets: keep ${DELNO_TELEPHONY_TOKEN} / ${WEBHOOK_TOKEN} — never commit real values.

active_pipeline: demo_openai
config_version: 7
default_provider: openai_realtime
audio_transport: audiosocket
audiosocket:
  format: slin
  host: 127.0.0.1
  port: 8090
  advertise_host: 127.0.0.1

contexts:
  default:
    greeting: "Здравствуйте, секретарь на линии, слушаю вас."
    profile: openai_realtime_24k
    provider: openai_realtime
    prompt: |
      РОД И ГОЛОС (строго):
      - Голос мужской. О себе только в мужском роде: «понял», «готов», «слышал», «рад», «записал».
      - Не представляйся женщиной.

      ИДЕНТИЧНОСТЬ:
      - Ты ИИ-секретарь компании на входящей линии (не человек, не ChatGPT/OpenAI).
      - Если спрашивают «ты робот?» — честно: ИИ-секретарь, помогаешь с вопросами и записью.
      - Не выдумывай личное имя и не притворяйся сотрудником-человеком.
      - Название и факты о компании — только из tools / сценария звонка. Не выдумывай тарифы и услуги.

      ЯЗЫК И РЕЧЬ:
      - Только русский. Коротко, 1–2 предложения. Без списков вслух.
      - Без канцелярита и служебных фраз («сейчас проверю в базе», «уточню в системе»).
      - Сразу вызывай tool, потом говори по результату.
      - Распознавание речи ошибается. Не зацикливайся на «не расслышал». Угадывай по смыслу; переспрашивай только если совсем пусто.
      - Запрещено повторять одну и ту же фразу «не расслышал / повторите» подряд.
      - Если собеседник перебивает — сразу уступай, коротко подтверди и продолжай по новой реплике.

      ----------------------------------------
      ИНСТРУМЕНТЫ (УНИВЕРСАЛЬНО — НЕ ЗАШИВАЙ СПИСОК)
      ----------------------------------------
      Набор tools у каждого tenant РАЗНЫЙ и часто меняется. Не полагайся на память о старых именах.

      1) В начале звонка ОДИН раз: delno_office action=list_enabled_tools, params {}.
      2) Дальше используй ТОЛЬКО id из ответа, и предпочитай ready=true.
      3) Если нужного ready=false или id нет — не вызывай его. Честно скажи, что сейчас недоступно, предложи альтернативу из ready или оставить контакт.
      4) Никогда не говори «записал / отправил / создал / нашёл слот», если tool не вызван или ok=false.
      5) Любой write (бронь, письмо, отмена, перенос) — только после явного «да/верно» абонента; в payload_json передавай confirmed_by_caller true.

      Как выбирать tool по смыслу (имена — ориентир, фактические id — только из list_enabled_tools):
      - факты о компании → knowledge / get_company_knowledge
      - записаться / забронировать → book_meeting (предпочтительно) или create_calendar_event
      - другое время / слоты → suggest_other_time или check_calendar
      - подтвердить / перенести / отменить встречу → confirm_meeting / reschedule_meeting / cancel_meeting
      - письмо / материалы → send_email / send_welcome_email
      - видеоссылка → create_conference
      - завершить разговор → hangup_call

      ----------------------------------------
      СБОР ДАННЫХ И ОБЯЗАТЕЛЬНЫЙ READBACK
      ----------------------------------------
      Любое важное поле: услышал → ПОВТОРИЛ → «Верно?» → если «нет» — исправил → снова readback.
      Без подтверждения нельзя следующий шаг и нельзя write-tools.

      Имя:
      - Повтори и спроси «Верно?».
      - Если каша / английский бред / обрывки — не настаивай: «Плохо расслышал имя, повторите ещё раз» → новый readback.
      - При двух провалах подряд — попроси по слогам.

      Email:
      - Вслух: @ → «собака», . → «точка». Пример: «Почта ivan собака gmail точка ком — верно?»
      - Без подтверждённого email не вызывай meeting/mail write-tools.

      Дата и время:
      - Полный readback: «На вторник 25 ноября в 15:00 — верно?»

      Компания / интерес (если нужно сценарию):
      - Короткий readback: «Компания X, интересно Y — так?»

      Типовой порядок записи (подставь реальные ready-tools):
      1) имя  2) компания/интерес по желанию  3) дата/время  4) email
      5) book_meeting (или эквивалент) с confirmed_by_caller true
      6) короткое подтверждение успеха  7) hangup_call по прощанию

      После успеха скажи только суть: «Готово, встреча на <дата время>. Детали отправил на почту.» (если mail-tool реально сработал; иначе не обещай письмо).
      Не озвучивай ссылки, JSON, сырой message tool.

      Если write-tool дважды неуспешен — честно: передашь специалисту. Не выдумывай успех.
    tools:
      - hangup_call

providers:
  openai_realtime:
    enabled: true
    api_version: ga
    # Full realtime (not mini) — точнее имена/email на русском
    model: gpt-realtime-2.1
    voice: cedar
    speed: 1.05
    temperature: 0.4
    reasoning_effort: low
    input_transcription_model: gpt-live-transcribe
    input_transcription_language: ru
    input_transcription_delay: high
    input_transcription_prompt: >-
      Телефонный разговор на русском: имя человека, компания, email (латиница),
      дата и время встречи, выплаты, карты, СБП, календарь, письмо.
    input_transcription_keywords:
      - Quantum Labs
      - Quantum Payouts
      - СБП
      - Телемост
      - gmail.com
      - mail.ru
      - yandex.ru
    input_encoding: ulaw
    input_sample_rate_hz: 8000
    provider_input_encoding: linear16
    provider_input_sample_rate_hz: 24000
    output_encoding: linear16
    output_sample_rate_hz: 24000
    target_encoding: mulaw
    target_sample_rate_hz: 8000
    turn_detection:
      type: server_vad
      # Короче Beget-1700 — меньше ощущение «не слышит / не перебивается»
      create_response: true
      silence_duration_ms: 550
      threshold: 0.55
      prefix_padding_ms: 200

in_call_tools:
  delno_office:
    kind: in_call_http_lookup
    enabled: true
    is_global: true
    description: >-
      Tenant office tools for this call. ALWAYS call list_enabled_tools first and use only
      returned ids (prefer ready=true). Tool set is tenant-specific and changes over time —
      common ids include get_company_knowledge, book_meeting, suggest_other_time,
      reschedule_meeting, confirm_meeting, cancel_meeting, check_calendar,
      create_calendar_event, send_email, send_welcome_email, create_conference, hangup_call.
      For writes: confirm with the caller, then confirmed_by_caller true. Never claim success if ok=false.
    url: http://127.0.0.1:18020/v1/telephony/calls/tool
    method: POST
    timeout_ms: 12000
    headers:
      Content-Type: application/json
      X-Telephony-Token: ${DELNO_TELEPHONY_TOKEN}
    body_template: |
      {"call_id":"{call_id}","action":"{action}","params":"{payload_json}"}
    parameters:
      - name: action
        type: string
        description: >-
          Tool id from list_enabled_tools (or list_enabled_tools itself). Do not invent ids.
        required: true
      - name: payload_json
        type: string
        description: >-
          JSON object of action inputs; use {} for list_enabled_tools.
          Writes require confirmed_by_caller true after the caller confirms.
        required: true
    return_raw_json: true
    error_message: "Сейчас не могу выполнить действие; предложите оставить контакт для связи."
  hangup_call:
    kind: hangup

post_call_tools:
  mailru_post_call:
    kind: generic_webhook
    phase: post_call
    url: http://127.0.0.1:8000/api/ava/post-call
    headers:
      Content-Type: application/json
      X-Webhook-Token: ${WEBHOOK_TOKEN}
    body_template: |
      {"call_id": "{{call_id}}", "caller_number": "{{caller_number}}", "caller_name": "{{caller_name}}", "call_duration": "{{call_duration}}", "call_outcome": "{{call_outcome}}", "summary": "{{summary}}", "transcript": "{{transcript}}"}

vad:
  use_provider_vad: true

# Восстановлено с Beget + укорочена защита приветствия (было 6000–8000 → 2500)
barge_in:
  enabled: true
  energy_threshold: 1200
  min_ms: 280
  cooldown_ms: 400
  post_tts_end_protection_ms: 400
  greeting_protection_ms: 2500
  initial_protection_ms: 800
  pipeline_talk_detect_enabled: false
  provider_fallback_enabled: true
  provider_fallback_providers:
    - openai_realtime
  provider_output_suppress_ms: 900

streaming:
  greeting_rtp_wait_ms: 100
  pipeline_streaming_overlap: true
  pipeline_filler_enabled: false
  chunk_size_ms: 20
  connection_timeout_ms: 120000
  continuous_stream: true
  empty_backoff_ticks_max: 8
  greeting_min_start_ms: 20
  jitter_buffer_ms: 120
  low_watermark_ms: 40
  min_start_ms: 40
  provider_grace_ms: 500
  keepalive_interval_ms: 5000
  normalizer:
    enabled: true
    target_rms: 1400
    max_gain_db: 12.0
