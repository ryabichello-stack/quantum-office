<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Outreach · Quantum Panel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f5f7);
      --text: var(--tg-theme-text-color, #1c1c1e);
      --hint: var(--tg-theme-hint-color, #6e6e73);
      --btn: var(--tg-theme-button-color, #ff5a1f);
      --btn-text: var(--tg-theme-button-text-color, #fff);
      --card: var(--tg-theme-secondary-bg-color, #ffffff);
      --line: rgba(60,60,67,.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Manrope, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px 14px 32px;
    }
    h1 { margin: 0 0 2px; font-size: 1.28rem; letter-spacing: -0.03em; }
    .sub { margin: 0 0 12px; color: var(--hint); font-size: 0.82rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .card.wide { grid-column: 1 / -1; }
    .card.tap { cursor: pointer; border: 1px solid transparent; }
    .card.tap:active { border-color: var(--btn); }
    .n { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
    .l { margin-top: 3px; font-size: 0.72rem; color: var(--hint); font-weight: 500; }
    .status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(255,90,31,.12); color: #c2410c;
      font-size: 0.78rem; font-weight: 600;
    }
    .status.ok { background: rgba(52,199,89,.14); color: #1b7a38; }
    .status.warn { background: rgba(180,83,9,.12); color: #92400e; }
    .err {
      margin-top: 12px; padding: 12px; border-radius: 12px;
      background: rgba(255,59,48,.1); color: #b42318; font-size: 0.85rem;
    }
    .days {
      display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .days::-webkit-scrollbar { display: none; }
    .day-chip {
      flex: 0 0 auto; min-width: 64px; padding: 10px 10px 8px;
      border-radius: 14px; border: 1px solid var(--line);
      background: var(--card); text-align: center; cursor: pointer;
    }
    .day-chip .d { font-size: 0.78rem; font-weight: 700; }
    .day-chip .c { margin-top: 4px; font-size: 0.7rem; color: var(--hint); }
    .day-chip.on { border-color: var(--btn); background: rgba(255,90,31,.1); }
    .day-chip.empty { opacity: 0.45; }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin: 4px 0 10px;
    }
    .nav button {
      height: 36px; min-width: 36px; padding: 0 12px; border: 0; border-radius: 10px;
      background: var(--card); color: var(--text); font-size: 0.9rem; font-weight: 600;
    }
    .nav .label { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.02em; }
    .list { display: grid; gap: 8px; margin-top: 8px; }
    .row {
      background: var(--card); border-radius: 14px; padding: 12px;
      border: 1px solid var(--line);
    }
    .row-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .who { font-weight: 700; font-size: 0.92rem; letter-spacing: -0.01em; }
    .when { font-size: 0.72rem; color: var(--hint); white-space: nowrap; }
    .co { margin-top: 3px; font-size: 0.82rem; color: var(--text); }
    .mail { margin-top: 2px; font-size: 0.78rem; color: var(--hint); word-break: break-all; }
    .meta-line { margin-top: 4px; font-size: 0.72rem; color: var(--hint); }
    button.refresh, button.primary {
      margin-top: 12px; width: 100%; height: 44px; border: 0; border-radius: 12px;
      background: var(--btn); color: var(--btn-text); font-size: 0.95rem; font-weight: 600;
    }
    button.ghost {
      margin-top: 8px; width: 100%; height: 40px; border: 1px solid var(--line);
      border-radius: 12px; background: transparent; color: var(--text); font-weight: 600;
    }
    .meta { margin-top: 10px; font-size: 0.7rem; color: var(--hint); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="view-home">
    <h1>Outreach</h1>
    <p class="sub">Quantum Panel · статистика и письма по дням</p>
    <div id="home"></div>
  </div>
  <div id="view-day" class="hidden">
    <div class="nav">
      <button type="button" id="backBtn">←</button>
      <button type="button" id="dayPrev" aria-label="Предыдущий день">‹</button>
      <div class="label" id="dayTitle">День</div>
      <button type="button" id="dayNext" aria-label="Следующий день">›</button>
    </div>
    <div id="dayBody"></div>
  </div>
  <div id="view-engage" class="hidden">
    <div class="nav">
      <button type="button" id="engageBack">←</button>
      <div class="label" id="engageTitle">Звонки</div>
      <span></span>
    </div>
    <div id="engageBody"></div>
  </div>
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        try { tg.setHeaderColor("secondary_bg_color"); } catch (e) {}
      }

      var state = { stats: null, day: null, letters: null, view: "home" };

      function apiBase() {
        var path = location.pathname || "";
        var m = path.match(/^(.*)\/ui\/tg-stats\/?$/);
        if (m) return m[1] || "";
        if (path.indexOf("/_ava_outreach") === 0) return "/_ava_outreach";
        if (path.indexOf("/_quantum_console") === 0) return "/_quantum_console/api/outreach";
        return "";
      }

      function headers() {
        var h = { "Accept": "application/json" };
        var initData = (tg && tg.initData) || "";
        if (initData) h["X-Telegram-Init-Data"] = initData;
        return h;
      }

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function fmtDayLabel(iso) {
        if (!iso) return "—";
        try {
          var p = iso.split("-");
          var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
          var wd = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"][d.getUTCDay()];
          return wd + " " + p[2] + "." + p[1];
        } catch (e) {
          return iso;
        }
      }

      function showView(name) {
        state.view = name;
        document.getElementById("view-home").classList.toggle("hidden", name !== "home");
        document.getElementById("view-day").classList.toggle("hidden", name !== "day");
        document.getElementById("view-engage").classList.toggle("hidden", name !== "engage");
        if (tg && tg.BackButton) {
          if (name === "day" || name === "engage") {
            tg.BackButton.show();
            tg.BackButton.onClick(goHome);
          } else {
            tg.BackButton.hide();
          }
        }
      }

      function goHome() {
        showView("home");
        if (state.stats) renderHome(state.stats);
      }

      function dayIndex(days, day) {
        for (var i = 0; i < days.length; i++) if (days[i].day === day) return i;
        return -1;
      }

      function fmtWhen(iso) {
        if (!iso) return "—";
        try {
          var d = new Date(iso);
          if (isNaN(d.getTime())) return String(iso).slice(0, 16);
          return d.toLocaleString("ru-RU", {
            timeZone: "Europe/Moscow",
            day: "numeric",
            month: "short",
            hour: "2-digit",
            minute: "2-digit"
          });
        } catch (e) {
          return String(iso).slice(0, 16);
        }
      }

      function renderHome(data) {
        state.stats = data;
        var root = document.getElementById("home");
        root.innerHTML = "";

        var st = (data.run_state || "").toLowerCase();
        var badge = el("span", "status" + (st === "playing" ? " ok" : st === "paused" ? " warn" : ""), data.run_state_ru || data.run_state || "—");
        var head = el("div", "card wide");
        head.appendChild(el("div", "l", "Статус"));
        head.appendChild(badge);
        root.appendChild(head);

        var grid = el("div", "grid");
        function card(n, l, onClick) {
          var c = el("div", "card" + (onClick ? " tap" : ""));
          c.appendChild(el("div", "n", String(n)));
          c.appendChild(el("div", "l", l));
          if (onClick) c.onclick = onClick;
          grid.appendChild(c);
        }
        card((data.sent_today || 0) + " / " + (data.daily_limit || "—"), "Сегодня / лимит");
        card(data.remaining_today, "Осталось сегодня");
        card(data.pending, "В очереди");
        card(data.sent_total, "Всего отправлено");
        card(data.callback_requests || 0, "Кнопка «Перезвонить»", function () { openEngage("callbacks"); });
        card(data.calls_total || 0, "Звонки AVA", function () { openEngage("calls"); });
        root.appendChild(grid);

        var explain = data.send_explain || {};
        var lines = explain.lines || (explain.text ? [explain.text] : []);
        if (lines.length) {
          var box = el("div", "card wide");
          box.appendChild(el("div", "l", explain.title || "Почему не все письма ушли сегодня"));
          lines.forEach(function (ln) {
            var p = el("div", "sub");
            p.style.margin = "6px 0 0";
            p.style.color = "var(--text)";
            p.textContent = ln;
            box.appendChild(p);
          });
          root.appendChild(box);
        }

        root.appendChild(el("div", "sub", "Дни отправки — нажмите, чтобы открыть письма"));
        var days = data.days || [];
        var strip = el("div", "days");
        var selected = data.selected_day || (days.length ? days[days.length - 1].day : "");
        days.forEach(function (d) {
          var chip = el("button", "day-chip" + (d.day === selected ? " on" : "") + (!d.sent ? " empty" : ""));
          chip.type = "button";
          chip.appendChild(el("div", "d", fmtDayLabel(d.day)));
          chip.appendChild(el("div", "c", (d.sent || 0) + " писем"));
          chip.onclick = function () { openDay(d.day); };
          strip.appendChild(chip);
        });
        root.appendChild(strip);

        var open = el("button", "primary", "Открыть письма за " + fmtDayLabel(selected));
        open.type = "button";
        open.onclick = function () { openDay(selected); };
        root.appendChild(open);

        var eng = el("button", "ghost", "Заявки на звонок и звонки AVA");
        eng.type = "button";
        eng.onclick = function () { openEngage("callbacks"); };
        root.appendChild(eng);

        var btn = el("button", "ghost", "Обновить");
        btn.type = "button";
        btn.onclick = loadHome;
        root.appendChild(btn);
        root.appendChild(el("div", "meta", "дни по UTC · время писем — МСК"));
      }

      function renderEngage(payload, tab) {
        state.engage = payload;
        var title = tab === "calls" ? "Звонки AVA" : "Кнопка «Перезвонить»";
        document.getElementById("engageTitle").textContent = title;
        var body = document.getElementById("engageBody");
        body.innerHTML = "";

        var tabs = el("div", "days");
        [["callbacks", "Заявки"], ["calls", "Звонки"]].forEach(function (pair) {
          var chip = el("button", "day-chip" + (tab === pair[0] ? " on" : ""));
          chip.type = "button";
          chip.appendChild(el("div", "d", pair[1]));
          var n = pair[0] === "calls"
            ? ((payload.summary && payload.summary.calls_total) || 0)
            : ((payload.summary && payload.summary.callback_requests) || 0);
          chip.appendChild(el("div", "c", String(n)));
          chip.onclick = function () { renderEngage(payload, pair[0]); };
          tabs.appendChild(chip);
        });
        body.appendChild(tabs);

        var list = el("div", "list");
        if (tab === "calls") {
          var calls = (payload.calls && payload.calls.items) || [];
          if (!calls.length) {
            body.appendChild(el("div", "card wide", "Звонков пока нет (или ещё не поступали в Outreach)."));
          } else {
            calls.forEach(function (it) {
              var row = el("div", "row");
              var top = el("div", "row-top");
              top.appendChild(el("div", "who", it.name || it.phone || "Звонок"));
              top.appendChild(el("div", "when", fmtWhen(it.created_at)));
              row.appendChild(top);
              if (it.company) row.appendChild(el("div", "co", it.company));
              row.appendChild(el("div", "mail", it.phone || ""));
              var bits = [];
              if (it.interest) bits.push(it.interest);
              if (it.duration != null) bits.push(it.duration + " с");
              if (it.qualified) bits.push("qualified");
              if (it.meeting) bits.push("встреча");
              if (it.deal_id) bits.push("сделка " + it.deal_id);
              if (bits.length) row.appendChild(el("div", "meta-line", bits.join(" · ")));
              if (it.summary) row.appendChild(el("div", "meta-line", it.summary));
              list.appendChild(row);
            });
            body.appendChild(list);
          }
        } else {
          var cbs = (payload.callbacks && payload.callbacks.recent) || [];
          if (!cbs.length) {
            body.appendChild(el("div", "card wide", "Заявок с кнопки «Перезвонить» пока нет."));
          } else {
            cbs.forEach(function (it) {
              var row = el("div", "row");
              var top = el("div", "row-top");
              top.appendChild(el("div", "who", it.fio || "Заявка"));
              top.appendChild(el("div", "when", fmtWhen(it.created_at)));
              row.appendChild(top);
              row.appendChild(el("div", "mail", it.phone || ""));
              var bits = [];
              if (it.source_email) bits.push(it.source_email);
              if (it.dial_mode) bits.push(it.dial_mode);
              bits.push(it.dial_ok ? "дозвон ok" : "дозвон fail");
              row.appendChild(el("div", "meta-line", bits.join(" · ")));
              list.appendChild(row);
            });
            body.appendChild(list);
          }
        }
        showView("engage");
      }

      function openEngage(tab) {
        fetch(apiBase() + "/api/tg/engagement", { headers: headers(), credentials: "same-origin" })
          .then(function (r) {
            return r.json().then(function (j) {
              if (!r.ok || !j.ok) throw new Error((j && (j.error || j.detail)) || ("HTTP " + r.status));
              return j;
            });
          })
          .then(function (j) { renderEngage(j, tab || "callbacks"); })
          .catch(function (e) {
            showView("engage");
            document.getElementById("engageTitle").textContent = "Звонки";
            var body = document.getElementById("engageBody");
            body.innerHTML = "";
            body.appendChild(el("div", "err", String(e.message || e)));
          });
      }

      function renderDay(payload) {
        state.letters = payload;
        state.day = payload.day;
        document.getElementById("dayTitle").textContent = fmtDayLabel(payload.day) + " · " + (payload.count || 0);
        var body = document.getElementById("dayBody");
        body.innerHTML = "";

        var days = (payload.days || (state.stats && state.stats.days) || []);
        var strip = el("div", "days");
        days.forEach(function (d) {
          var chip = el("button", "day-chip" + (d.day === payload.day ? " on" : "") + (!d.sent ? " empty" : ""));
          chip.type = "button";
          chip.appendChild(el("div", "d", fmtDayLabel(d.day)));
          chip.appendChild(el("div", "c", (d.sent || 0) + ""));
          chip.onclick = function () { openDay(d.day); };
          strip.appendChild(chip);
        });
        body.appendChild(strip);

        var items = payload.items || [];
        if (!items.length) {
          body.appendChild(el("div", "card wide", "В этот день писем не было."));
        } else {
          var list = el("div", "list");
          items.forEach(function (it) {
            var row = el("div", "row");
            var top = el("div", "row-top");
            top.appendChild(el("div", "who", it.contact_name || it.email || "—"));
            top.appendChild(el("div", "when", it.sent_at_local || "—"));
            row.appendChild(top);
            if (it.company) row.appendChild(el("div", "co", it.company));
            row.appendChild(el("div", "mail", it.email || ""));
            var bits = [];
            if (it.city) bits.push(it.city);
            if (it.phone) bits.push(it.phone);
            if (it.inn) bits.push("ИНН " + it.inn);
            if (it.status) bits.push(it.status);
            if (bits.length) row.appendChild(el("div", "meta-line", bits.join(" · ")));
            list.appendChild(row);
          });
          body.appendChild(list);
        }
        showView("day");
      }

      function openDay(day) {
        fetch(apiBase() + "/api/tg/day?date=" + encodeURIComponent(day), { headers: headers(), credentials: "same-origin" })
          .then(function (r) {
            return r.json().then(function (j) {
              if (!r.ok || !j.ok) throw new Error((j && (j.error || j.detail)) || ("HTTP " + r.status));
              return j;
            });
          })
          .then(renderDay)
          .catch(function (e) {
            var body = document.getElementById("dayBody");
            showView("day");
            document.getElementById("dayTitle").textContent = fmtDayLabel(day);
            body.innerHTML = "";
            body.appendChild(el("div", "err", String(e.message || e)));
          });
      }

      function shiftDay(delta) {
        var days = (state.letters && state.letters.days) || (state.stats && state.stats.days) || [];
        var cur = state.day || (state.stats && state.stats.selected_day);
        var idx = dayIndex(days, cur);
        if (idx < 0) return;
        var next = days[idx + delta];
        if (next) openDay(next.day);
      }

      function loadHome() {
        fetch(apiBase() + "/api/tg/stats", { headers: headers(), credentials: "same-origin" })
          .then(function (r) {
            return r.json().then(function (j) {
              if (!r.ok || !j.ok) throw new Error((j && (j.error || j.detail)) || ("HTTP " + r.status));
              return j;
            });
          })
          .then(function (data) {
            renderHome(data);
            showView("home");
          })
          .catch(function (e) {
            var root = document.getElementById("home");
            root.innerHTML = "";
            root.appendChild(el("div", "err", String(e.message || e) + " Откройте через @Quantum_panel_bot → Статистика."));
          });
      }

      document.getElementById("backBtn").onclick = goHome;
      document.getElementById("engageBack").onclick = goHome;
      document.getElementById("dayPrev").onclick = function () { shiftDay(-1); };
      document.getElementById("dayNext").onclick = function () { shiftDay(1); };

      loadHome();
    })();
  </script>
</body>
</html>
